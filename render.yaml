services:
  - type: web
    name: smart-attendance-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATA_DIR
        value: /var/data
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
