{% extends "base.html" %}

{% block title %}Login - Smart Attendance System{% endblock %}

{% block head %}
<style>
    .login-wrapper {
        min-height: calc(80vh - 100px);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        position: relative;
        overflow: hidden;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
        z-index: -1;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        color: white;
        margin-bottom: 1rem;
        box-shadow: 0 10px 25px var(--primary-glow);
    }

    .login-title {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .login-subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .hint-box {
        margin-top: 1.5rem;
        padding: 1rem;
        background: rgba(99, 102, 241, 0.1);
        border: 1px dashed rgba(99, 102, 241, 0.3);
        border-radius: var(--radius-md);
        font-size: 0.85rem;
        color: #a5b4fc;
        text-align: center;
    }

    .hint-box code {
        background: rgba(0, 0, 0, 0.3);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        color: #fff;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="login-title">Admin Login</h1>
            <p class="login-subtitle">Access the Smart Attendance Dashboard</p>
        </div>

        <form action="{{ url_for('login_post') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username"><i class="fa-solid fa-user me-2"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password"><i class="fa-solid fa-lock me-2"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="hint-box">
            <i class="fa-solid fa-circle-info"></i> Default Credentials: <code>admin</code> / <code>admin123</code>
        </div>
    </div>
</div>
{% endblock %}
